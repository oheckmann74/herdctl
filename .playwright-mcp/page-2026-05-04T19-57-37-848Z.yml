      - main [ref=e104]:
        - generic [ref=e105]:
          - paragraph [ref=e106]: If you are seeing this page, it means that KAYAK thinks you are a "bot," and the page you were trying to get to is only useful for humans.
          - heading "What is a bot?" [level=2] [ref=e107]
          - paragraph [ref=e108]: A bot, or robot, or crawler is software that visits web sites and collects data from them without a human present. Search engines like Google use robots to build up search results. KAYAK uses bots to search for travel deals. Bots are generally a good thing, but some web pages are for humans only. For example, we don't want bots running about trying to book airline tickets. They tend to try to cram large suitcases in the overhead bin, and they prattle on about celebrities they know while you are trying to watch the movie.
          - heading "But I am not a bot! I'm human!" [level=2] [ref=e109]
